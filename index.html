<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemicat - 打开化学学习新方式</title>
    <meta name="description" content="Chemicat - 随时随记、靶向复习、赛博养猫，大化化原全覆盖的化学学习平台。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            <img src="photo/icon.png" alt="Chemicat 图标" class="logo-img">
            Chemicat
        </a>
        <nav>
            <a class="active" href="index.html">主页</a>
            <a href="solutions.html">方案</a>
            <a href="cats.html">猫猫图鉴</a>
            <a href="about.html">关于</a>
            <a href="https://chemicat.vercel.app" class="btn-download">立即体验</a>
        </nav>
    </header>

    <main>
        <!-- Hero 区域 -->
        <section class="hero">
            <h1 class="animate">Chemicat<br><span class="gradient-text">打开化学学习新方式</span></h1>
            <p class="animate delay-1">随时随记 · 靶向复习 · 赛博养猫，是你最懂化学的学习搭子。</p>
            <a href="https://chemicat.vercel.app" class="btn-primary animate delay-2">立即体验</a>

            <div class="hero-theme-img animate delay-3">
                <img src="photo/theme.png" alt="Chemicat 主题图">
            </div>
        </section>


        <!-- 使用流程 -->
        <section class="feature-section">
            <h2 class="scroll-animate">使用流程</h2>

            <!-- 步骤 1 -->
            <div class="feature-grid scroll-animate">
                <div class="feature-content">
                    <div class="feature-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <h3>选择你的学习搭子</h3>
                    <p>新用户注册账号，选择一只小猫作为自己的学习搭子，开始你的化学学习之旅。</p>
                </div>
                <div class="feature-image">
                    <img src="photo/1.png" alt="选择小猫学习搭子界面">
                </div>
            </div>

            <!-- 步骤 2 -->
            <div class="feature-grid scroll-animate alt-layout">
                <div class="feature-image">
                    <img src="photo/2.png" alt="添加学习方案界面">
                </div>
                <div class="feature-content">
                    <div class="feature-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                    <h3>背记单词攒猫粮</h3>
                    <p>选择方案大学化学 or 化学原理，背记单词攒猫粮积分，让学习产生真实奖励。</p>
                </div>
            </div>

            <!-- 步骤 3 -->
            <div class="feature-grid scroll-animate">
                <div class="feature-content">
                    <div class="feature-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </div>
                    <h3>用猫粮喂食小猫</h3>
                    <p>猫粮可以用来喂食小猫增加饱食度，让你的小猫越来越健康可爱！</p>
                </div>
                <div class="feature-image">
                    <img src="photo/3.png" alt="用猫粮喂食小猫界面">
                </div>
            </div>

            <!-- 步骤 4 -->
            <div class="feature-grid scroll-animate alt-layout">
                <div class="feature-image">
                    <img src="photo/4.png" alt="签到与亲密度界面">
                </div>
                <div class="feature-content">
                    <div class="feature-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </div>
                    <h3>提升亲密度</h3>
                    <p>签到和记忆单词均可获得猫粮，保持高饱食度和定期撸猫可提高亲密度，解锁专属皮肤！</p>
                </div>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
